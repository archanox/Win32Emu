<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Win32Emu - Web Emulator</title>
	<base href="/Win32Emu/emulator/" />
	<link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
	<link rel="stylesheet" href="css/app.css" />
	<link rel="icon" type="image/png" href="favicon.png" />
	<link href="Win32Emu.Wasm.styles.css" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>
	<div id="app">
		<svg class="loading-progress">
			<circle r="40%" cx="50%" cy="50%" />
			<circle r="40%" cx="50%" cy="50%" />
		</svg>
		<div class="loading-progress-text"></div>
	</div>

	<div id="blazor-error-ui">
		An unhandled error has occurred.
		<a href="." class="reload">Reload</a>
		<span class="dismiss">🗙</span>
	</div>
	
	<script>
		window.initializeEmulator = (canvasId) => {
			const canvas = document.getElementById(canvasId);
			if (!canvas) {
				console.error("Canvas not found");
				return;
			}
			
			const ctx = canvas.getContext('2d');
			if (!ctx) {
				console.error("Could not get 2D context");
				return;
			}
			
			// Clear canvas with black background
			ctx.fillStyle = '#000000';
			ctx.fillRect(0, 0, canvas.width, canvas.height);
			
			// Draw a test pattern
			ctx.fillStyle = '#00FF00';
			ctx.font = '20px monospace';
			ctx.fillText('Win32Emu - Ready', 20, 40);
			ctx.fillText('Waiting for executable...', 20, 70);
			
			console.log("Emulator canvas initialized");
		};
		
		// Web Audio API placeholder
		window.audioContext = null;
		window.initializeAudio = () => {
			try {
				window.audioContext = new (window.AudioContext || window.webkitAudioContext)();
				console.log("Audio context initialized");
				return true;
			} catch (e) {
				console.error("Error initializing audio:", e);
				return false;
			}
		};
		
		// Folder selection helper
		window.getFilesFromInput = async (inputId) => {
			const input = document.getElementById(inputId);
			if (!input || !input.files || input.files.length === 0) {
				return [];
			}
			
			const files = [];
			const fileList = input.files;
			
			for (let i = 0; i < fileList.length; i++) {
				const file = fileList[i];
				
				// Read file as base64
				const base64 = await new Promise((resolve, reject) => {
					const reader = new FileReader();
					reader.onload = () => {
						// Remove the data URL prefix (e.g., "data:application/octet-stream;base64,")
						const base64String = reader.result.split(',')[1];
						resolve(base64String);
					};
					reader.onerror = reject;
					reader.readAsDataURL(file);
				});
				
				// Get relative path (webkitRelativePath includes folder name)
				const relativePath = file.webkitRelativePath || file.name;
				
				files.push({
					name: file.name,
					relativePath: relativePath,
					size: file.size,
					content: base64
				});
			}
			
			console.log(`Loaded ${files.length} files from folder`);
			return files;
		};
	</script>
	
	<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
