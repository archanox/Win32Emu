<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Win32Emu - Web Emulator</title>
	<base href="/Win32Emu/emulator/" />
	<link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
	<link rel="stylesheet" href="css/app.css" />
	<link rel="icon" type="image/png" href="favicon.png" />
	<link href="Win32Emu.Wasm.styles.css" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>
	<div id="app">
		<svg class="loading-progress">
			<circle r="40%" cx="50%" cy="50%" />
			<circle r="40%" cx="50%" cy="50%" />
		</svg>
		<div class="loading-progress-text"></div>
	</div>

	<div id="blazor-error-ui">
		<div id="blazor-error-header">
			<strong>An unhandled error has occurred.</strong>
			<a href="." class="reload">Reload</a>
			<span class="dismiss">🗙</span>
		</div>
		<div id="blazor-error-details" style="display: none; margin-top: 10px; padding: 10px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-wrap: break-word;">
			No error details available.
		</div>
		<button id="blazor-error-toggle" style="margin-top: 8px; padding: 4px 8px; cursor: pointer; background: #ffc107; border: 1px solid #e0a800; border-radius: 4px; font-size: 12px;">
			Show Details
		</button>
	</div>
	
	<script>
		// Global error storage for detailed error messages
		window.lastError = null;
		window.errorLog = [];
		
		// Enhanced error display function
		function displayErrorDetails(error) {
			const detailsEl = document.getElementById('blazor-error-details');
			if (detailsEl && error) {
				let errorText = '';
				
				if (error instanceof Error) {
					errorText = `Error: ${error.message}\n`;
					if (error.stack) {
						errorText += `\nStack Trace:\n${error.stack}`;
					}
				} else if (typeof error === 'string') {
					errorText = error;
				} else if (error.reason) {
					// For unhandled promise rejections
					const reason = error.reason;
					if (reason instanceof Error) {
						errorText = `Unhandled Promise Rejection: ${reason.message}\n`;
						if (reason.stack) {
							errorText += `\nStack Trace:\n${reason.stack}`;
						}
					} else {
						errorText = `Unhandled Promise Rejection: ${JSON.stringify(reason, null, 2)}`;
					}
				} else {
					try {
						errorText = JSON.stringify(error, null, 2);
					} catch (e) {
						errorText = String(error);
					}
				}
				
				// Add timestamp
				const timestamp = new Date().toISOString();
				errorText = `[${timestamp}]\n${errorText}`;
				
				detailsEl.textContent = errorText;
				console.error('Blazor Error Details:', errorText);
			}
		}
		
		// Toggle button for error details
		document.addEventListener('DOMContentLoaded', function() {
			const toggleBtn = document.getElementById('blazor-error-toggle');
			const detailsEl = document.getElementById('blazor-error-details');
			
			if (toggleBtn && detailsEl) {
				toggleBtn.addEventListener('click', function() {
					if (detailsEl.style.display === 'none') {
						detailsEl.style.display = 'block';
						toggleBtn.textContent = 'Hide Details';
					} else {
						detailsEl.style.display = 'none';
						toggleBtn.textContent = 'Show Details';
					}
				});
			}
			
			// Dismiss button
			const dismissBtn = document.querySelector('#blazor-error-ui .dismiss');
			if (dismissBtn) {
				dismissBtn.addEventListener('click', function() {
					document.getElementById('blazor-error-ui').style.display = 'none';
				});
			}
		});
		
		// Global error handler
		window.onerror = function(message, source, lineno, colno, error) {
			console.error('Global error:', { message, source, lineno, colno, error });
			window.lastError = error || { message, source, lineno, colno };
			window.errorLog.push({
				type: 'error',
				message,
				source,
				lineno,
				colno,
				error,
				timestamp: new Date().toISOString()
			});
			
			if (error) {
				displayErrorDetails(error);
			} else {
				displayErrorDetails(`Error: ${message}\nSource: ${source}\nLine: ${lineno}, Column: ${colno}`);
			}
			
			return false;
		};
		
		// Unhandled promise rejection handler
		window.addEventListener('unhandledrejection', function(event) {
			console.error('Unhandled promise rejection:', event);
			window.lastError = event.reason;
			window.errorLog.push({
				type: 'unhandledrejection',
				reason: event.reason,
				timestamp: new Date().toISOString()
			});
			
			displayErrorDetails(event);
		});
		window.initializeEmulator = (canvasId) => {
			const canvas = document.getElementById(canvasId);
			if (!canvas) {
				console.error("Canvas not found");
				return;
			}
			
			const ctx = canvas.getContext('2d');
			if (!ctx) {
				console.error("Could not get 2D context");
				return;
			}
			
			// Clear canvas with black background
			ctx.fillStyle = '#000000';
			ctx.fillRect(0, 0, canvas.width, canvas.height);
			
			// Draw a test pattern
			ctx.fillStyle = '#00FF00';
			ctx.font = '20px monospace';
			ctx.fillText('Win32Emu - Ready', 20, 40);
			ctx.fillText('Waiting for executable...', 20, 70);
			
			console.log("Emulator canvas initialized");
		};
		
		// Update canvas with RGBA frame buffer data
		window.updateCanvas = (canvasId, base64Data, width, height) => {
			const canvas = document.getElementById(canvasId);
			if (!canvas) {
				console.error("Canvas not found");
				return;
			}
			
			const ctx = canvas.getContext('2d');
			if (!ctx) {
				console.error("Could not get 2D context");
				return;
			}
			
			// Decode base64 data
			const binaryString = atob(base64Data);
			const len = binaryString.length;
			const bytes = new Uint8ClampedArray(len);
			for (let i = 0; i < len; i++) {
				bytes[i] = binaryString.charCodeAt(i);
			}
			
			// Create ImageData and draw to canvas
			const imageData = new ImageData(bytes, width, height);
			ctx.putImageData(imageData, 0, 0);
		};
		
		// Web Audio API
		window.audioContext = null;
		window.audioStreams = {};
		
		window.initializeAudio = async () => {
			try {
				window.audioContext = new (window.AudioContext || window.webkitAudioContext)();
				console.log("Audio context initialized, sample rate:", window.audioContext.sampleRate);
				return true;
			} catch (e) {
				console.error("Error initializing audio:", e);
				return false;
			}
		};
		
		window.createAudioStream = (streamId, frequency, channels, bufferSize) => {
			if (!window.audioContext) {
				console.error("Audio context not initialized");
				return;
			}
			
			try {
				// Calculate buffer size in samples
				const samplesPerBuffer = bufferSize / 2; // 16-bit samples
				
				// ScriptProcessorNode requires power of 2 buffer size
				// Find the nearest power of 2 between 256 and 4096
				const clampedSamples = Math.max(256, Math.min(4096, samplesPerBuffer));
				const lowerExp = Math.floor(Math.log2(clampedSamples));
				const upperExp = Math.ceil(Math.log2(clampedSamples));
				const lowerPow2 = Math.pow(2, lowerExp);
				const upperPow2 = Math.pow(2, upperExp);
				const nearestPow2 = (clampedSamples - lowerPow2 <= upperPow2 - clampedSamples) ? lowerPow2 : upperPow2;
				
				// Create a ScriptProcessorNode for audio streaming (deprecated but widely supported)
				// In production, AudioWorklet would be better but requires separate worklet files
				const scriptNode = window.audioContext.createScriptProcessor(
					nearestPow2,
					0,  // input channels
					channels // output channels
				);
				
				const gainNode = window.audioContext.createGain();
				scriptNode.connect(gainNode);
				gainNode.connect(window.audioContext.destination);
				
				window.audioStreams[streamId] = {
					frequency: frequency,
					channels: channels,
					bufferSize: bufferSize,
					scriptNode: scriptNode,
					gainNode: gainNode,
					paused: false,
					queue: [],           // Queue of Float32Array buffers to play
					position: 0,         // Current position in current buffer
					currentBuffer: null  // Current buffer being played
				};
				
				// Audio processing callback
				scriptNode.onaudioprocess = (e) => {
					const stream = window.audioStreams[streamId];
					if (!stream || stream.paused) {
						// Output silence
						for (let c = 0; c < e.outputBuffer.numberOfChannels; c++) {
							e.outputBuffer.getChannelData(c).fill(0);
						}
						return;
					}
					
					const outputLength = e.outputBuffer.getChannelData(0).length;
					
					for (let c = 0; c < e.outputBuffer.numberOfChannels; c++) {
						const output = e.outputBuffer.getChannelData(c);
						let outputIndex = 0;
						
						while (outputIndex < outputLength) {
							// Get current buffer or next from queue
							if (!stream.currentBuffer || stream.position >= stream.currentBuffer.length / stream.channels) {
								stream.currentBuffer = stream.queue.shift();
								stream.position = 0;
								if (!stream.currentBuffer) {
									// No more data, output silence
									while (outputIndex < outputLength) {
										output[outputIndex++] = 0;
									}
									break;
								}
							}
							
							// Copy samples from buffer to output
							while (outputIndex < outputLength && stream.position < stream.currentBuffer.length / stream.channels) {
								output[outputIndex++] = stream.currentBuffer[stream.position * stream.channels + c];
								stream.position++;
							}
						}
					}
				};
				
				console.log(`Created audio stream ${streamId} (${frequency}Hz, ${channels} channels, buffer: ${bufferSize})`);
			} catch (e) {
				console.error(`Error creating audio stream ${streamId}:`, e);
			}
		};
		
		window.writeAudioData = (streamId, base64Data) => {
			const stream = window.audioStreams[streamId];
			if (!stream) {
				return;
			}
			
			try {
				// Resume audio context if suspended (browser autoplay policy)
				if (window.audioContext.state === 'suspended') {
					window.audioContext.resume();
				}
				
				// Decode base64 audio data
				const binaryString = atob(base64Data);
				const len = binaryString.length;
				const bytes = new Uint8Array(len);
				for (let i = 0; i < len; i++) {
					bytes[i] = binaryString.charCodeAt(i);
				}
				
				// Convert to float32 audio samples (assuming 16-bit signed PCM input)
				const samples = new Float32Array(bytes.length / 2);
				const dataView = new DataView(bytes.buffer);
				for (let i = 0; i < samples.length; i++) {
					// Read as signed 16-bit little-endian
					const int16 = dataView.getInt16(i * 2, true);
					samples[i] = int16 / 32768.0;
				}
				
				// Add to queue for streaming playback
				stream.queue.push(samples);
				
				// Limit queue size to prevent memory growth
				while (stream.queue.length > 10) {
					console.warn(`Audio queue overflow for stream ${streamId} (length=${stream.queue.length}). Dropping oldest buffer.`);
					stream.queue.shift();
				}
			} catch (e) {
				console.error(`Error writing audio data for stream ${streamId}:`, e);
			}
		};
		
		window.destroyAudioStream = (streamId) => {
			const stream = window.audioStreams[streamId];
			if (stream) {
				// Disconnect and clean up audio nodes
				if (stream.scriptNode) {
					stream.scriptNode.disconnect();
					stream.scriptNode.onaudioprocess = null;
				}
				if (stream.gainNode) {
					stream.gainNode.disconnect();
				}
				// Clear the queue
				stream.queue = [];
				stream.currentBuffer = null;
				
				delete window.audioStreams[streamId];
				console.log(`Destroyed audio stream ${streamId}`);
			}
		};
		
		window.setStreamVolume = (streamId, volume) => {
			const stream = window.audioStreams[streamId];
			if (stream) {
				stream.gainNode.gain.value = volume;
			}
		};
		
		window.setStreamPaused = (streamId, paused) => {
			const stream = window.audioStreams[streamId];
			if (stream) {
				stream.paused = paused;
			}
		};
		
		// Folder selection helper
		window.getFilesFromInput = async (inputId) => {
			const input = document.getElementById(inputId);
			if (!input || !input.files || input.files.length === 0) {
				return [];
			}
			
			const files = [];
			const fileList = input.files;
			
			for (let i = 0; i < fileList.length; i++) {
				const file = fileList[i];
				
				// Read file as base64
				const base64 = await new Promise((resolve, reject) => {
					const reader = new FileReader();
					reader.onload = () => {
						// Remove the data URL prefix (e.g., "data:application/octet-stream;base64,")
						const base64String = reader.result.split(',')[1];
						resolve(base64String);
					};
					reader.onerror = reject;
					reader.readAsDataURL(file);
				});
				
				// Get relative path (webkitRelativePath includes folder name)
				const relativePath = file.webkitRelativePath || file.name;
				
				files.push({
					name: file.name,
					relativePath: relativePath,
					size: file.size,
					content: base64
				});
			}
			
			console.log(`Loaded ${files.length} files from folder`);
			return files;
		};
	</script>
	
	<script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
