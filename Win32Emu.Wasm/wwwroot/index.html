<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Win32Emu - Web Emulator</title>
	<base href="/Win32Emu/emulator/" />
	<link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
	<link rel="stylesheet" href="css/app.css" />
	<link rel="icon" type="image/png" href="favicon.png" />
	<link href="Win32Emu.Wasm.styles.css" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>
	<div id="app">
		<svg class="loading-progress">
			<circle r="40%" cx="50%" cy="50%" />
			<circle r="40%" cx="50%" cy="50%" />
		</svg>
		<div class="loading-progress-text"></div>
	</div>

	<div id="blazor-error-ui">
		An unhandled error has occurred.
		<a href="." class="reload">Reload</a>
		<span class="dismiss">🗙</span>
	</div>
	
	<script>
		window.initializeEmulator = (canvasId) => {
			const canvas = document.getElementById(canvasId);
			if (!canvas) {
				console.error("Canvas not found");
				return;
			}
			
			const ctx = canvas.getContext('2d');
			if (!ctx) {
				console.error("Could not get 2D context");
				return;
			}
			
			// Clear canvas with black background
			ctx.fillStyle = '#000000';
			ctx.fillRect(0, 0, canvas.width, canvas.height);
			
			// Draw a test pattern
			ctx.fillStyle = '#00FF00';
			ctx.font = '20px monospace';
			ctx.fillText('Win32Emu - Ready', 20, 40);
			ctx.fillText('Waiting for executable...', 20, 70);
			
			console.log("Emulator canvas initialized");
		};
		
		// Update canvas with RGBA frame buffer data
		window.updateCanvas = (canvasId, base64Data, width, height) => {
			const canvas = document.getElementById(canvasId);
			if (!canvas) {
				console.error("Canvas not found");
				return;
			}
			
			const ctx = canvas.getContext('2d');
			if (!ctx) {
				console.error("Could not get 2D context");
				return;
			}
			
			// Decode base64 data
			const binaryString = atob(base64Data);
			const len = binaryString.length;
			const bytes = new Uint8ClampedArray(len);
			for (let i = 0; i < len; i++) {
				bytes[i] = binaryString.charCodeAt(i);
			}
			
			// Create ImageData and draw to canvas
			const imageData = new ImageData(bytes, width, height);
			ctx.putImageData(imageData, 0, 0);
		};
		
		// Web Audio API
		window.audioContext = null;
		window.audioStreams = {};
		
		window.initializeAudio = () => {
			try {
				window.audioContext = new (window.AudioContext || window.webkitAudioContext)();
				console.log("Audio context initialized");
				return true;
			} catch (e) {
				console.error("Error initializing audio:", e);
				return false;
			}
		};
		
		window.createAudioStream = (streamId, frequency, channels, bufferSize) => {
			if (!window.audioContext) {
				console.error("Audio context not initialized");
				return;
			}
			
			try {
				window.audioStreams[streamId] = {
					frequency: frequency,
					channels: channels,
					bufferSize: bufferSize,
					gainNode: window.audioContext.createGain(),
					paused: false,
					queue: []
				};
				
				window.audioStreams[streamId].gainNode.connect(window.audioContext.destination);
				console.log(`Created audio stream ${streamId}`);
			} catch (e) {
				console.error(`Error creating audio stream ${streamId}:`, e);
			}
		};
		
		window.writeAudioData = (streamId, base64Data) => {
			const stream = window.audioStreams[streamId];
			if (!stream || stream.paused) {
				return;
			}
			
			try {
				// Decode base64 audio data
				const binaryString = atob(base64Data);
				const len = binaryString.length;
				const bytes = new Uint8Array(len);
				for (let i = 0; i < len; i++) {
					bytes[i] = binaryString.charCodeAt(i);
				}
				
				// Convert to float32 audio samples
				// This is a simplified conversion - actual implementation would need proper format handling
				const samples = new Float32Array(bytes.length / 2);
				for (let i = 0; i < samples.length; i++) {
					const int16 = (bytes[i * 2 + 1] << 8) | bytes[i * 2];
					samples[i] = int16 / 32768.0;
				}
				
				// Create audio buffer and play
				const audioBuffer = window.audioContext.createBuffer(
					stream.channels,
					samples.length / stream.channels,
					stream.frequency
				);
				
				for (let channel = 0; channel < stream.channels; channel++) {
					const channelData = audioBuffer.getChannelData(channel);
					for (let i = 0; i < channelData.length; i++) {
						channelData[i] = samples[i * stream.channels + channel];
					}
				}
				
				const source = window.audioContext.createBufferSource();
				source.buffer = audioBuffer;
				source.connect(stream.gainNode);
				source.start();
			} catch (e) {
				console.error(`Error writing audio data for stream ${streamId}:`, e);
			}
		};
		
		window.destroyAudioStream = (streamId) => {
			if (window.audioStreams[streamId]) {
				window.audioStreams[streamId].gainNode.disconnect();
				delete window.audioStreams[streamId];
				console.log(`Destroyed audio stream ${streamId}`);
			}
		};
		
		window.setStreamVolume = (streamId, volume) => {
			const stream = window.audioStreams[streamId];
			if (stream) {
				stream.gainNode.gain.value = volume;
			}
		};
		
		window.setStreamPaused = (streamId, paused) => {
			const stream = window.audioStreams[streamId];
			if (stream) {
				stream.paused = paused;
			}
		};
		
		// Folder selection helper
		window.getFilesFromInput = async (inputId) => {
			const input = document.getElementById(inputId);
			if (!input || !input.files || input.files.length === 0) {
				return [];
			}
			
			const files = [];
			const fileList = input.files;
			
			for (let i = 0; i < fileList.length; i++) {
				const file = fileList[i];
				
				// Read file as base64
				const base64 = await new Promise((resolve, reject) => {
					const reader = new FileReader();
					reader.onload = () => {
						// Remove the data URL prefix (e.g., "data:application/octet-stream;base64,")
						const base64String = reader.result.split(',')[1];
						resolve(base64String);
					};
					reader.onerror = reject;
					reader.readAsDataURL(file);
				});
				
				// Get relative path (webkitRelativePath includes folder name)
				const relativePath = file.webkitRelativePath || file.name;
				
				files.push({
					name: file.name,
					relativePath: relativePath,
					size: file.size,
					content: base64
				});
			}
			
			console.log(`Loaded ${files.length} files from folder`);
			return files;
		};
	</script>
	
	<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
