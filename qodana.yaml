####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: jetbrains/qodana-cdnet:latest
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses
bootstrap: |
  curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0 --install-dir /usr/share/dotnet
  export PATH="/usr/share/dotnet:$PATH"
  export DOTNET_ROOT="/usr/share/dotnet"
  dotnet --version