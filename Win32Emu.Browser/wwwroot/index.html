<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Win32Emu - Windows 32-bit Emulator</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Win32Emu.Browser.styles.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.json" />
    <meta name="description" content="Win32Emu - A Windows 32-bit PE executable emulator for the web" />
    <meta name="theme-color" content="#512bd4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Win32Emu" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text">Loading Win32Emu...</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    
    <!-- WebGPU Canvas for rendering -->
    <canvas id="webgpu-canvas" style="display: none;"></canvas>
    
    <!-- WebGPU Helper Script -->
    <script src="js/webgpu.js"></script>
    
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
