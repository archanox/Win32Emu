---
name: CPU Test Results

on:
  # Run on schedule (weekly, every Monday at 00:00 UTC)
  schedule:
    - cron: '0 0 * * 1'

  # Allow manual trigger
  workflow_dispatch:

  # Run on pushes to main that modify CPU emulator or test code
  push:
    branches:
      - main
    paths:
      - 'Win32Emu/Cpu/**'
      - 'Win32Emu.Tests.Emulator/**'
      - '.github/workflows/cpu-test-results.yml'

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-report:
    name: Generate CPU Test Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Test Reporter
        run: >
          dotnet build
          Win32Emu.Tools.TestReporter/Win32Emu.Tools.TestReporter.csproj
          --configuration Release --no-restore

      - name: Run Test Reporter
        run: |
          mkdir -p test-results
          dotnet run --project Win32Emu.Tools.TestReporter \
            --configuration Release --no-build -- \
            Win32Emu.Tests.Emulator/TestData/SingleStepTests \
            test-results \
            100

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: test-results

  # Deployment job
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate-report
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
