<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Win32Emu - Web Emulator</title>
	<base href="/Win32Emu/emulator/" />
	<link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
	<link rel="stylesheet" href="css/app.css" />
	<link rel="stylesheet" href="css/win32-ui.css" />
	<link rel="icon" type="image/png" href="favicon.png" />
	<link href="Win32Emu.Wasm.styles.css" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>
	<div id="app">
		<svg class="loading-progress">
			<circle r="40%" cx="50%" cy="50%" />
			<circle r="40%" cx="50%" cy="50%" />
		</svg>
		<div class="loading-progress-text"></div>
	</div>

	<div id="blazor-error-ui">
		<div id="blazor-error-header">
			<strong>An unhandled error has occurred.</strong>
			<a href="." class="reload">Reload</a>
			<span class="dismiss">🗙</span>
		</div>
		<div id="blazor-error-details">
			No error details available.
		</div>
		<button id="blazor-error-toggle">
			Show Details
		</button>
	</div>
	
	<!-- In-page console log viewer for mobile debugging -->
	<div id="page-console">
		<div id="page-console-header">
			<span>📋 Console Log</span>
			<div id="page-console-controls">
				<button id="page-console-clear" title="Clear logs" aria-label="Clear console logs">🗑️</button>
				<button id="page-console-minimize" title="Minimize" aria-label="Minimize console">➖</button>
			</div>
		</div>
		<div id="page-console-content"></div>
	</div>
	<button id="page-console-toggle" title="Show Console" aria-label="Show Console">📋</button>
	
	<script>
		// ===========================================
		// In-page Console Log Viewer for Mobile Debugging
		// ===========================================
		(function() {
			const MAX_LOG_ENTRIES = 200;
			let logEntries = [];
			let isConsoleVisible = false;
			let updateScheduled = false;
			
			// Store original console methods
			const originalConsole = {
				log: console.log.bind(console),
				warn: console.warn.bind(console),
				error: console.error.bind(console),
				info: console.info.bind(console),
				debug: console.debug.bind(console)
			};
			
			// HTML escape function for XSS prevention
			function escapeHtml(text) {
				return String(text)
					.replace(/&/g, '&amp;')
					.replace(/</g, '&lt;')
					.replace(/>/g, '&gt;')
					.replace(/"/g, '&quot;')
					.replace(/'/g, '&#039;');
			}
			
			function formatValue(value) {
				if (value === null) return 'null';
				if (value === undefined) return 'undefined';
				if (typeof value === 'object') {
					try {
						if (value instanceof Error) {
							return `${value.name}: ${value.message}${value.stack ? '\n' + value.stack : ''}`;
						}
						return JSON.stringify(value, null, 2);
					} catch (e) {
						return String(value);
					}
				}
				return String(value);
			}
			
			function addLogEntry(level, args) {
				const timestamp = new Date().toLocaleTimeString();
				const message = Array.from(args).map(formatValue).join(' ');
				
				logEntries.push({ level, timestamp, message });
				
				// Limit log entries
				while (logEntries.length > MAX_LOG_ENTRIES) {
					logEntries.shift();
				}
				
				scheduleUpdate();
			}
			
			// Batch DOM updates using requestAnimationFrame for performance
			function scheduleUpdate() {
				if (!updateScheduled) {
					updateScheduled = true;
					requestAnimationFrame(() => {
						updateConsoleDisplay();
						updateScheduled = false;
					});
				}
			}
			
			function updateConsoleDisplay() {
				const content = document.getElementById('page-console-content');
				if (!content) return;
				
				const wasAtBottom = content.scrollHeight - content.scrollTop <= content.clientHeight + 50;
				
				content.innerHTML = logEntries.map(entry => {
					const levelClass = `log-${entry.level}`;
					// Escape both timestamp and message to prevent XSS
					const escapedTimestamp = escapeHtml(entry.timestamp);
					const escapedMessage = escapeHtml(entry.message).replace(/\n/g, '<br>');
					return `<div class="log-entry ${levelClass}"><span class="log-time">[${escapedTimestamp}]</span> <span class="log-level">[${entry.level.toUpperCase()}]</span> ${escapedMessage}</div>`;
				}).join('');
				
				// Auto-scroll to bottom if user was already at bottom
				if (wasAtBottom) {
					content.scrollTop = content.scrollHeight;
				}
			}
			
			// Override console methods to capture logs
			console.log = function(...args) {
				originalConsole.log(...args);
				addLogEntry('log', args);
			};
			
			console.warn = function(...args) {
				originalConsole.warn(...args);
				addLogEntry('warn', args);
			};
			
			console.error = function(...args) {
				originalConsole.error(...args);
				addLogEntry('error', args);
			};
			
			console.info = function(...args) {
				originalConsole.info(...args);
				addLogEntry('info', args);
			};
			
			console.debug = function(...args) {
				originalConsole.debug(...args);
				addLogEntry('debug', args);
			};
			
			// Initialize console UI when DOM is ready
			document.addEventListener('DOMContentLoaded', function() {
				const consoleEl = document.getElementById('page-console');
				const toggleBtn = document.getElementById('page-console-toggle');
				const minimizeBtn = document.getElementById('page-console-minimize');
				const clearBtn = document.getElementById('page-console-clear');
				
				if (toggleBtn) {
					toggleBtn.addEventListener('click', function() {
						isConsoleVisible = true;
						consoleEl.style.display = 'flex';
						toggleBtn.style.display = 'none';
					});
				}
				
				if (minimizeBtn) {
					minimizeBtn.addEventListener('click', function() {
						isConsoleVisible = false;
						consoleEl.style.display = 'none';
						toggleBtn.style.display = 'block';
					});
				}
				
				if (clearBtn) {
					clearBtn.addEventListener('click', function() {
						logEntries = [];
						updateConsoleDisplay();
					});
				}
				
				// Log initial message
				console.log('Win32Emu WASM console initialized. Logs will appear here.');
			});
			
			// Export for external access
			window.pageConsole = {
				show: function() {
					const consoleEl = document.getElementById('page-console');
					const toggleBtn = document.getElementById('page-console-toggle');
					if (consoleEl) consoleEl.style.display = 'flex';
					if (toggleBtn) toggleBtn.style.display = 'none';
					isConsoleVisible = true;
				},
				hide: function() {
					const consoleEl = document.getElementById('page-console');
					const toggleBtn = document.getElementById('page-console-toggle');
					if (consoleEl) consoleEl.style.display = 'none';
					if (toggleBtn) toggleBtn.style.display = 'block';
					isConsoleVisible = false;
				},
				clear: function() {
					logEntries = [];
					updateConsoleDisplay();
				},
				getLogs: function() {
					return logEntries.slice();
				}
			};
		})();
		
		// ===========================================
		// Global Error Handling
		// ===========================================
		// Global error storage for detailed error messages
		window.lastError = null;
		window.errorLog = [];
		
		// DirectDraw diagnostics tracking
		window.ddrawDiagnostics = {
			canvasUpdateCount: 0,
			lastUpdateTime: null,
			backendInitialized: false,
			renderingError: false,
			frameBufferSize: 0
		};
		
		// Refresh DirectDraw diagnostics display
		window.refreshDDrawDiagnostics = function() {
			try {
				const canvas = document.getElementById('emulatorCanvas');
				
				// Update canvas dimensions
				const dimEl = document.getElementById('canvasDimensions');
				if (dimEl && canvas) {
					dimEl.textContent = `${canvas.width}x${canvas.height}`;
				}
				
				// Update last update time
				const lastUpdateEl = document.getElementById('lastCanvasUpdate');
				if (lastUpdateEl) {
					if (window.ddrawDiagnostics.lastUpdateTime) {
						const elapsed = Date.now() - window.ddrawDiagnostics.lastUpdateTime;
						lastUpdateEl.textContent = `${(elapsed / 1000).toFixed(1)}s ago`;
					} else {
						lastUpdateEl.textContent = 'Never';
					}
				}
				
				// Update count
				const countEl = document.getElementById('canvasUpdateCount');
				if (countEl) {
					countEl.textContent = window.ddrawDiagnostics.canvasUpdateCount.toString();
				}
				
				// Update canvas visibility
				const visibleEl = document.getElementById('canvasVisible');
				if (visibleEl && canvas) {
					const rect = canvas.getBoundingClientRect();
					const isVisible = rect.width > 0 && rect.height > 0;
					visibleEl.textContent = isVisible ? 'Yes' : 'No';
					visibleEl.style.color = isVisible ? 'green' : 'red';
				}
				
				// Update backend status
				const backendEl = document.getElementById('backendInitialized');
				if (backendEl) {
					backendEl.textContent = window.ddrawDiagnostics.backendInitialized ? 'Yes' : 'No';
					backendEl.style.color = window.ddrawDiagnostics.backendInitialized ? 'green' : 'orange';
				}
				
				// Update frame buffer size
				const fbSizeEl = document.getElementById('frameBufferSize');
				if (fbSizeEl) {
					if (window.ddrawDiagnostics.frameBufferSize > 0) {
						const kb = (window.ddrawDiagnostics.frameBufferSize / 1024).toFixed(1);
						fbSizeEl.textContent = `${kb} KB`;
					} else {
						fbSizeEl.textContent = 'Not allocated';
					}
				}
				
				// Update error status
				const errorEl = document.getElementById('renderingError');
				if (errorEl) {
					errorEl.textContent = window.ddrawDiagnostics.renderingError ? 'Yes' : 'No';
					errorEl.style.color = window.ddrawDiagnostics.renderingError ? 'red' : 'green';
				}
				
				console.log('[Diagnostics] DirectDraw stats refreshed:', window.ddrawDiagnostics);
			} catch (e) {
				console.error('[Diagnostics] Error refreshing DirectDraw diagnostics:', e);
			}
		};
		
		// Enhanced error display function
		function displayErrorDetails(error) {
			const detailsEl = document.getElementById('blazor-error-details');
			if (detailsEl && error) {
				let errorText = '';
				
				if (error instanceof Error) {
					errorText = `Error: ${error.message}\n`;
					if (error.stack) {
						errorText += `\nStack Trace:\n${error.stack}`;
					}
				} else if (typeof error === 'string') {
					errorText = error;
				} else if (error.reason) {
					// For unhandled promise rejections
					const reason = error.reason;
					if (reason instanceof Error) {
						errorText = `Unhandled Promise Rejection: ${reason.message}\n`;
						if (reason.stack) {
							errorText += `\nStack Trace:\n${reason.stack}`;
						}
					} else {
						errorText = `Unhandled Promise Rejection: ${JSON.stringify(reason, null, 2)}`;
					}
				} else {
					try {
						errorText = JSON.stringify(error, null, 2);
					} catch (e) {
						errorText = String(error);
					}
				}
				
				// Add timestamp
				const timestamp = new Date().toISOString();
				errorText = `[${timestamp}]\n${errorText}`;
				
				detailsEl.textContent = errorText;
				console.error('Blazor Error Details:', errorText);
			}
		}
		
		// Toggle button for error details
		document.addEventListener('DOMContentLoaded', function() {
			const toggleBtn = document.getElementById('blazor-error-toggle');
			const detailsEl = document.getElementById('blazor-error-details');
			
			if (toggleBtn && detailsEl) {
				toggleBtn.addEventListener('click', function() {
					// Check for empty string or 'none' since CSS sets initial display to none
					if (detailsEl.style.display === '' || detailsEl.style.display === 'none') {
						detailsEl.style.display = 'block';
						toggleBtn.textContent = 'Hide Details';
					} else {
						detailsEl.style.display = 'none';
						toggleBtn.textContent = 'Show Details';
					}
				});
			}
			
			// Dismiss button
			const dismissBtn = document.querySelector('#blazor-error-ui .dismiss');
			if (dismissBtn) {
				dismissBtn.addEventListener('click', function() {
					document.getElementById('blazor-error-ui').style.display = 'none';
				});
			}
		});
		
		// Maximum number of errors to keep in the log
		const MAX_ERROR_LOG_SIZE = 50;
		
		// Global error handler
		window.onerror = function(message, source, lineno, colno, error) {
			console.error('Global error:', { message, source, lineno, colno, error });
			window.lastError = error || { message, source, lineno, colno };
			window.errorLog.push({
				type: 'error',
				message,
				source,
				lineno,
				colno,
				error,
				timestamp: new Date().toISOString()
			});
			
			// Limit error log size to prevent memory growth
			while (window.errorLog.length > MAX_ERROR_LOG_SIZE) {
				window.errorLog.shift();
			}
			
			if (error) {
				displayErrorDetails(error);
			} else {
				displayErrorDetails(`Error: ${message}\nSource: ${source}\nLine: ${lineno}, Column: ${colno}`);
			}
			
			return false;
		};
		
		// Unhandled promise rejection handler
		window.addEventListener('unhandledrejection', function(event) {
			console.error('Unhandled promise rejection:', event);
			window.lastError = event.reason;
			window.errorLog.push({
				type: 'unhandledrejection',
				reason: event.reason,
				timestamp: new Date().toISOString()
			});
			
			// Limit error log size to prevent memory growth
			while (window.errorLog.length > MAX_ERROR_LOG_SIZE) {
				window.errorLog.shift();
			}
			
			displayErrorDetails(event);
		});
		window.initializeEmulator = (canvasId) => {
			console.log(`Initializing emulator canvas with id: ${canvasId}`);
			const canvas = document.getElementById(canvasId);
			if (!canvas) {
				console.error(`Canvas element not found with id: ${canvasId}`);
				return;
			}
			
			const ctx = canvas.getContext('2d');
			if (!ctx) {
				console.error("Could not get 2D context from canvas");
				return;
			}
			
			console.log(`Canvas found: ${canvas.width}x${canvas.height}`);
			
			// Clear canvas with black background
			ctx.fillStyle = '#000000';
			ctx.fillRect(0, 0, canvas.width, canvas.height);
			
			// Draw a test pattern
			ctx.fillStyle = '#00FF00';
			ctx.font = '20px monospace';
			ctx.fillText('Win32Emu - Ready', 20, 40);
			ctx.fillText('Waiting for executable...', 20, 70);
			
			console.log("Emulator canvas initialized successfully");
		};
		
		// Global flag to stop emulator on error
		window.emulatorStopped = false;
		window.emulatorError = null;
		
		// Function to stop emulator on error
		window.stopEmulatorOnError = (errorMessage) => {
			window.emulatorStopped = true;
			window.emulatorError = errorMessage;
			console.error("🛑 EMULATOR STOPPED DUE TO ERROR:");
			console.error(errorMessage);
			alert(`Emulator stopped due to rendering error:\n\n${errorMessage}\n\nCheck console for details.`);
		};
		
		// Update canvas with RGBA frame buffer data
		window.updateCanvas = (canvasId, base64Data, width, height) => {
			const BYTES_PER_PIXEL = 4; // RGBA format
			
			const canvas = document.getElementById(canvasId);
			if (!canvas) {
				throw new Error("Canvas not found: " + canvasId);
			}
			
			const ctx = canvas.getContext('2d');
			if (!ctx) {
				throw new Error("Could not get 2D context");
			}
			
			// Resize canvas if dimensions changed
			if (canvas.width !== width || canvas.height !== height) {
				console.log(`Resizing canvas from ${canvas.width}x${canvas.height} to ${width}x${height}`);
				canvas.width = width;
				canvas.height = height;
			}
			
			// Decode base64 data
			const binaryString = atob(base64Data);
			const len = binaryString.length;
			const bytes = new Uint8ClampedArray(len);
			for (let i = 0; i < len; i++) {
				bytes[i] = binaryString.charCodeAt(i);
			}
			
			// Validate data length matches expected size
			const expectedLength = width * height * BYTES_PER_PIXEL;
			if (len !== expectedLength) {
				throw new Error(`Data length mismatch: expected ${expectedLength} bytes (${width}x${height}x${BYTES_PER_PIXEL}), got ${len} bytes`);
			}
			
			// Create ImageData and draw to canvas
			const imageData = new ImageData(bytes, width, height);
			ctx.putImageData(imageData, 0, 0);
			
			// Update diagnostics
			window.ddrawDiagnostics.canvasUpdateCount++;
			window.ddrawDiagnostics.lastUpdateTime = Date.now();
			window.ddrawDiagnostics.backendInitialized = true;
			window.ddrawDiagnostics.frameBufferSize = len;
			
			console.log(`Canvas updated successfully: ${width}x${height} (${len} bytes, update #${window.ddrawDiagnostics.canvasUpdateCount})`);
		};
		
		// Wrapper function that stops emulator on error
		window.updateCanvasWithErrorHandling = (canvasId, base64Data, width, height) => {
			// Check if emulator was already stopped
			if (window.emulatorStopped) {
				console.error("🛑 Emulator is stopped, ignoring canvas update");
				throw new Error("Emulator stopped due to previous error: " + window.emulatorError);
			}
			
			try {
				console.log(`[updateCanvas] Called: ${canvasId}, ${width}x${height}, data length: ${base64Data?.length || 0}`);
				
				// Validate inputs
				if (!canvasId) {
					throw new Error("Canvas ID is null or undefined");
				}
				if (!base64Data) {
					throw new Error("Base64 data is null or undefined");
				}
				if (width <= 0 || height <= 0) {
					throw new Error(`Invalid dimensions: ${width}x${height}`);
				}
				
				// Call the actual update function
				window.updateCanvas(canvasId, base64Data, width, height);
				
				console.log(`[updateCanvas] SUCCESS`);
			} catch (error) {
				// Mark error state in diagnostics
				window.ddrawDiagnostics.renderingError = true;
				
				// Stop the emulator on any error
				const errorMsg = `Canvas update failed: ${error.message}\n\nStack: ${error.stack}`;
				console.error("🛑 CRITICAL ERROR in updateCanvas:");
				console.error(errorMsg);
				
				window.stopEmulatorOnError(errorMsg);
				
				// Re-throw to propagate to C#
				throw error;
			}
		};
		
		// Web Audio API
		window.audioContext = null;
		window.audioStreams = {};
		
		window.initializeAudio = async () => {
			try {
				window.audioContext = new (window.AudioContext || window.webkitAudioContext)();
				console.log("Audio context initialized, sample rate:", window.audioContext.sampleRate);
				return true;
			} catch (e) {
				console.error("Error initializing audio:", e);
				return false;
			}
		};
		
		window.createAudioStream = (streamId, frequency, channels, bufferSize) => {
			if (!window.audioContext) {
				console.error("Audio context not initialized");
				return;
			}
			
			try {
				// Calculate buffer size in samples
				const samplesPerBuffer = bufferSize / 2; // 16-bit samples
				
				// ScriptProcessorNode requires power of 2 buffer size
				// Find the nearest power of 2 between 256 and 4096
				const clampedSamples = Math.max(256, Math.min(4096, samplesPerBuffer));
				const lowerExp = Math.floor(Math.log2(clampedSamples));
				const upperExp = Math.ceil(Math.log2(clampedSamples));
				const lowerPow2 = Math.pow(2, lowerExp);
				const upperPow2 = Math.pow(2, upperExp);
				const nearestPow2 = (clampedSamples - lowerPow2 <= upperPow2 - clampedSamples) ? lowerPow2 : upperPow2;
				
				// Create a ScriptProcessorNode for audio streaming (deprecated but widely supported)
				// In production, AudioWorklet would be better but requires separate worklet files
				const scriptNode = window.audioContext.createScriptProcessor(
					nearestPow2,
					0,  // input channels
					channels // output channels
				);
				
				const gainNode = window.audioContext.createGain();
				scriptNode.connect(gainNode);
				gainNode.connect(window.audioContext.destination);
				
				window.audioStreams[streamId] = {
					frequency: frequency,
					channels: channels,
					bufferSize: bufferSize,
					scriptNode: scriptNode,
					gainNode: gainNode,
					paused: false,
					queue: [],           // Queue of Float32Array buffers to play
					position: 0,         // Current position in current buffer
					currentBuffer: null  // Current buffer being played
				};
				
				// Audio processing callback
				scriptNode.onaudioprocess = (e) => {
					const stream = window.audioStreams[streamId];
					if (!stream || stream.paused) {
						// Output silence
						for (let c = 0; c < e.outputBuffer.numberOfChannels; c++) {
							e.outputBuffer.getChannelData(c).fill(0);
						}
						return;
					}
					
					const outputLength = e.outputBuffer.getChannelData(0).length;
					
					for (let c = 0; c < e.outputBuffer.numberOfChannels; c++) {
						const output = e.outputBuffer.getChannelData(c);
						let outputIndex = 0;
						
						while (outputIndex < outputLength) {
							// Get current buffer or next from queue
							if (!stream.currentBuffer || stream.position >= stream.currentBuffer.length / stream.channels) {
								stream.currentBuffer = stream.queue.shift();
								stream.position = 0;
								if (!stream.currentBuffer) {
									// No more data, output silence
									while (outputIndex < outputLength) {
										output[outputIndex++] = 0;
									}
									break;
								}
							}
							
							// Copy samples from buffer to output
							while (outputIndex < outputLength && stream.position < stream.currentBuffer.length / stream.channels) {
								output[outputIndex++] = stream.currentBuffer[stream.position * stream.channels + c];
								stream.position++;
							}
						}
					}
				};
				
				console.log(`Created audio stream ${streamId} (${frequency}Hz, ${channels} channels, buffer: ${bufferSize})`);
			} catch (e) {
				console.error(`Error creating audio stream ${streamId}:`, e);
			}
		};
		
		window.writeAudioData = (streamId, base64Data) => {
			const stream = window.audioStreams[streamId];
			if (!stream) {
				return;
			}
			
			try {
				// Resume audio context if suspended (browser autoplay policy)
				if (window.audioContext.state === 'suspended') {
					window.audioContext.resume();
				}
				
				// Decode base64 audio data
				const binaryString = atob(base64Data);
				const len = binaryString.length;
				const bytes = new Uint8Array(len);
				for (let i = 0; i < len; i++) {
					bytes[i] = binaryString.charCodeAt(i);
				}
				
				// Convert to float32 audio samples (assuming 16-bit signed PCM input)
				const samples = new Float32Array(bytes.length / 2);
				const dataView = new DataView(bytes.buffer);
				for (let i = 0; i < samples.length; i++) {
					// Read as signed 16-bit little-endian
					const int16 = dataView.getInt16(i * 2, true);
					samples[i] = int16 / 32768.0;
				}
				
				// Add to queue for streaming playback
				stream.queue.push(samples);
				
				// Limit queue size to prevent memory growth
				while (stream.queue.length > 10) {
					console.warn(`Audio queue overflow for stream ${streamId} (length=${stream.queue.length}). Dropping oldest buffer.`);
					stream.queue.shift();
				}
			} catch (e) {
				console.error(`Error writing audio data for stream ${streamId}:`, e);
			}
		};
		
		window.destroyAudioStream = (streamId) => {
			const stream = window.audioStreams[streamId];
			if (stream) {
				// Disconnect and clean up audio nodes
				if (stream.scriptNode) {
					stream.scriptNode.disconnect();
					stream.scriptNode.onaudioprocess = null;
				}
				if (stream.gainNode) {
					stream.gainNode.disconnect();
				}
				// Clear the queue
				stream.queue = [];
				stream.currentBuffer = null;
				
				delete window.audioStreams[streamId];
				console.log(`Destroyed audio stream ${streamId}`);
			}
		};
		
		window.setStreamVolume = (streamId, volume) => {
			const stream = window.audioStreams[streamId];
			if (stream) {
				stream.gainNode.gain.value = volume;
			}
		};
		
		window.setStreamPaused = (streamId, paused) => {
			const stream = window.audioStreams[streamId];
			if (stream) {
				stream.paused = paused;
			}
		};
		
		// Folder selection helper
		window.getFilesFromInput = async (inputId) => {
			const input = document.getElementById(inputId);
			if (!input || !input.files || input.files.length === 0) {
				return [];
			}
			
			const files = [];
			const fileList = input.files;
			
			for (let i = 0; i < fileList.length; i++) {
				const file = fileList[i];
				
				// Read file as base64
				const base64 = await new Promise((resolve, reject) => {
					const reader = new FileReader();
					reader.onload = () => {
						// Remove the data URL prefix (e.g., "data:application/octet-stream;base64,")
						const base64String = reader.result.split(',')[1];
						resolve(base64String);
					};
					reader.onerror = reject;
					reader.readAsDataURL(file);
				});
				
				// Get relative path (webkitRelativePath includes folder name)
				const relativePath = file.webkitRelativePath || file.name;
				
				files.push({
					name: file.name,
					relativePath: relativePath,
					size: file.size,
					content: base64
				});
			}
			
			console.log(`Loaded ${files.length} files from folder`);
			return files;
		};
		
		// Copy text to clipboard
		window.copyToClipboard = async (text) => {
			try {
				if (navigator.clipboard && navigator.clipboard.writeText) {
					await navigator.clipboard.writeText(text);
					return true;
				} else {
					// Fallback for older browsers
					const textArea = document.createElement('textarea');
					textArea.value = text;
					textArea.style.position = 'fixed';
					textArea.style.left = '-999999px';
					document.body.appendChild(textArea);
					textArea.focus();
					textArea.select();
					try {
						const successful = document.execCommand('copy');
						document.body.removeChild(textArea);
						return successful;
					} catch (err) {
						document.body.removeChild(textArea);
						return false;
					}
				}
			} catch (err) {
				console.error('Failed to copy to clipboard:', err);
				return false;
			}
		};
		
		// ===========================================
		// Input System - Keyboard and Mouse Event Handling
		// ===========================================
		
		// Win32 Virtual Key Code mapping (DOM KeyboardEvent.code → VK_*)
		// Reference: https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
		const VK_MAP = {
			// Function keys
			'F1': 0x70, 'F2': 0x71, 'F3': 0x72, 'F4': 0x73, 'F5': 0x74, 'F6': 0x75,
			'F7': 0x76, 'F8': 0x77, 'F9': 0x78, 'F10': 0x79, 'F11': 0x7A, 'F12': 0x7B,
			
			// Number keys (top row)
			'Digit0': 0x30, 'Digit1': 0x31, 'Digit2': 0x32, 'Digit3': 0x33, 'Digit4': 0x34,
			'Digit5': 0x35, 'Digit6': 0x36, 'Digit7': 0x37, 'Digit8': 0x38, 'Digit9': 0x39,
			
			// Letter keys
			'KeyA': 0x41, 'KeyB': 0x42, 'KeyC': 0x43, 'KeyD': 0x44, 'KeyE': 0x45, 'KeyF': 0x46,
			'KeyG': 0x47, 'KeyH': 0x48, 'KeyI': 0x49, 'KeyJ': 0x4A, 'KeyK': 0x4B, 'KeyL': 0x4C,
			'KeyM': 0x4D, 'KeyN': 0x4E, 'KeyO': 0x4F, 'KeyP': 0x50, 'KeyQ': 0x51, 'KeyR': 0x52,
			'KeyS': 0x53, 'KeyT': 0x54, 'KeyU': 0x55, 'KeyV': 0x56, 'KeyW': 0x57, 'KeyX': 0x58,
			'KeyY': 0x59, 'KeyZ': 0x5A,
			
			// Special keys
			'Escape': 0x1B, 'Space': 0x20, 'Enter': 0x0D, 'Tab': 0x09, 'Backspace': 0x08,
			'ShiftLeft': 0x10, 'ShiftRight': 0x10, 'ControlLeft': 0x11, 'ControlRight': 0x11,
			'AltLeft': 0x12, 'AltRight': 0x12, 'CapsLock': 0x14,
			
			// Arrow keys
			'ArrowLeft': 0x25, 'ArrowUp': 0x26, 'ArrowRight': 0x27, 'ArrowDown': 0x28,
			
			// Editing keys
			'Insert': 0x2D, 'Delete': 0x2E, 'Home': 0x24, 'End': 0x23,
			'PageUp': 0x21, 'PageDown': 0x22,
			
			// Numpad keys
			'Numpad0': 0x60, 'Numpad1': 0x61, 'Numpad2': 0x62, 'Numpad3': 0x63, 'Numpad4': 0x64,
			'Numpad5': 0x65, 'Numpad6': 0x66, 'Numpad7': 0x67, 'Numpad8': 0x68, 'Numpad9': 0x69,
			'NumpadMultiply': 0x6A, 'NumpadAdd': 0x6B, 'NumpadSubtract': 0x6D,
			'NumpadDecimal': 0x6E, 'NumpadDivide': 0x6F, 'NumpadEnter': 0x0D,
			
			// Punctuation and symbols
			'Minus': 0xBD, 'Equal': 0xBB, 'BracketLeft': 0xDB, 'BracketRight': 0xDD,
			'Backslash': 0xDC, 'Semicolon': 0xBA, 'Quote': 0xDE, 'Comma': 0xBC,
			'Period': 0xBE, 'Slash': 0xBF, 'Backquote': 0xC0
		};
		
		// Map DOM KeyboardEvent.code to Win32 VK code
		function mapKeyCode(code) {
			return VK_MAP[code] || 0;
		}
		
		// Reference to the WasmInputBackend instance for DotNet invocation
		let inputBackendRef = null;
		
		// Initialize input system
		window.initializeInput = function(canvasId, dotNetRef) {
			console.log(`Initializing input system for canvas: ${canvasId}`);
			
			// Store DotNet reference for later use
			inputBackendRef = dotNetRef;
			
			const canvas = document.getElementById(canvasId);
			if (!canvas) {
				console.error(`Canvas not found: ${canvasId}`);
				return false;
			}
			
			// Make canvas focusable
			canvas.tabIndex = 1;
			canvas.style.outline = 'none';
			
			// Keyboard event handlers
			canvas.addEventListener('keydown', (e) => {
				e.preventDefault();
				const vkCode = mapKeyCode(e.code);
				if (vkCode > 0 && inputBackendRef) {
					inputBackendRef.invokeMethodAsync('OnKeyDown', vkCode)
						.catch(err => console.error('OnKeyDown error:', err));
				}
			});
			
			canvas.addEventListener('keyup', (e) => {
				e.preventDefault();
				const vkCode = mapKeyCode(e.code);
				if (vkCode > 0 && inputBackendRef) {
					inputBackendRef.invokeMethodAsync('OnKeyUp', vkCode)
						.catch(err => console.error('OnKeyUp error:', err));
				}
			});
			
			// Mouse event handlers
			canvas.addEventListener('mousemove', (e) => {
				const rect = canvas.getBoundingClientRect();
				const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
				const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
				
				if (inputBackendRef) {
					inputBackendRef.invokeMethodAsync('OnMouseMove', x, y)
						.catch(err => console.error('OnMouseMove error:', err));
				}
			});
			
			canvas.addEventListener('mousedown', (e) => {
				e.preventDefault();
				canvas.focus(); // Ensure canvas has focus for keyboard input
				
				const rect = canvas.getBoundingClientRect();
				const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
				const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
				
				if (inputBackendRef) {
					inputBackendRef.invokeMethodAsync('OnMouseDown', e.button, x, y)
						.catch(err => console.error('OnMouseDown error:', err));
				}
			});
			
			canvas.addEventListener('mouseup', (e) => {
				e.preventDefault();
				const rect = canvas.getBoundingClientRect();
				const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
				const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
				
				if (inputBackendRef) {
					inputBackendRef.invokeMethodAsync('OnMouseUp', e.button, x, y)
						.catch(err => console.error('OnMouseUp error:', err));
				}
			});
			
			// Touch event handlers for mobile (simulating mouse events)
			canvas.addEventListener('touchstart', (e) => {
				e.preventDefault();
				canvas.focus();
				
				const rect = canvas.getBoundingClientRect();
				const touch = e.touches[0];
				const x = Math.floor((touch.clientX - rect.left) * (canvas.width / rect.width));
				const y = Math.floor((touch.clientY - rect.top) * (canvas.height / rect.height));
				
				if (inputBackendRef) {
					inputBackendRef.invokeMethodAsync('OnMouseDown', 0, x, y)
						.catch(err => console.error('OnMouseDown (touch) error:', err));
				}
			});
			
			canvas.addEventListener('touchmove', (e) => {
				e.preventDefault();
				const rect = canvas.getBoundingClientRect();
				const touch = e.touches[0];
				const x = Math.floor((touch.clientX - rect.left) * (canvas.width / rect.width));
				const y = Math.floor((touch.clientY - rect.top) * (canvas.height / rect.height));
				
				if (inputBackendRef) {
					inputBackendRef.invokeMethodAsync('OnMouseMove', x, y)
						.catch(err => console.error('OnMouseMove (touch) error:', err));
				}
			});
			
			canvas.addEventListener('touchend', (e) => {
				e.preventDefault();
				const rect = canvas.getBoundingClientRect();
				// Use last known position or center if no touches
				const x = canvas.width / 2;
				const y = canvas.height / 2;
				
				if (inputBackendRef) {
					inputBackendRef.invokeMethodAsync('OnMouseUp', 0, x, y)
						.catch(err => console.error('OnMouseUp (touch) error:', err));
				}
			});
			
			// Auto-focus canvas when page loads
			canvas.focus();
			
			console.log('Input system initialized successfully');
			return true;
		};
		
		// Send virtual key press (for on-screen keyboard buttons)
		window.sendVirtualKey = function(vkCode, isDown) {
			if (inputBackendRef) {
				if (isDown) {
					inputBackendRef.invokeMethodAsync('OnKeyDown', vkCode)
						.catch(err => console.error('Virtual key down error:', err));
				} else {
					inputBackendRef.invokeMethodAsync('OnKeyUp', vkCode)
						.catch(err => console.error('Virtual key up error:', err));
				}
			}
		};
		
		// Virtual key tap (down then up)
		window.tapVirtualKey = function(vkCode) {
			if (inputBackendRef) {
				inputBackendRef.invokeMethodAsync('OnKeyDown', vkCode)
					.then(() => {
						setTimeout(() => {
							inputBackendRef.invokeMethodAsync('OnKeyUp', vkCode)
								.catch(err => console.error('Virtual key up error:', err));
						}, 50);
					})
					.catch(err => console.error('Virtual key down error:', err));
			}
		};
	</script>
